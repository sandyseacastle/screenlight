[project]
name = "screenlight"
version = "0.1.0"
description = "Sync Tuya RGB Wi-Fi bulbs to the colours on your screen"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mss>=10.2",
    "numpy>=1.26",
    "tinytuya>=1.13",
]

[project.scripts]
screenlight = "screenlight.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screenlight"]

[tool.uv]
# System Pythons on Linux often lack tkinter; uv-managed builds always include it.
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
